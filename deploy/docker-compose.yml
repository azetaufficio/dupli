# Dupli server stack: server + PostgreSQL + Caddy (TLS). Usage:
#   cp deploy/.env.example deploy/.env   # then edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Local dev with a mail catcher (http://localhost:8025): add `--profile dev`.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dupli
      POSTGRES_USER: dupli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql  # postgres 18+: PGDATA is /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dupli -d dupli"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${DUPLI_IMAGE:-ghcr.io/azetaufficio/dupli-server:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Dupli: Host=postgres;Database=dupli;Username=dupli;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Dupli__PublicUrl: https://${DUPLI_HOST:?set DUPLI_HOST}
      # Optional automation key (header X-Dupli-Admin-Key) and /admin break-glass page; empty disables both.
      Dupli__Admin__ApiKey: ${DUPLI_ADMIN_API_KEY:-}
      # Operator login for the web UI (Microsoft Entra ID, server-side OIDC).
      Dupli__Auth__Mode: ${DUPLI_AUTH_MODE:-EntraId}
      Dupli__Auth__EntraId__TenantId: ${ENTRA_TENANT_ID:-}
      Dupli__Auth__EntraId__ClientId: ${ENTRA_CLIENT_ID:-}
      Dupli__Auth__EntraId__ClientSecret: ${ENTRA_CLIENT_SECRET:-}
      # First owner, required while no operator user exists. Everyone else is invited from the Users page.
      Dupli__Auth__BootstrapOwnerEmail: ${DUPLI_BOOTSTRAP_OWNER_EMAIL:-}
      # Alert e-mail channel: Smtp or Office365 (Microsoft Graph).
      Notifications__Channel: ${NOTIFICATIONS_CHANNEL:-Smtp}
      Notifications__Smtp__Host: ${SMTP_HOST:-}
      Notifications__Smtp__Port: ${SMTP_PORT:-587}
      Notifications__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Notifications__Smtp__Username: ${SMTP_USERNAME:-}
      Notifications__Smtp__Password: ${SMTP_PASSWORD:-}
      Notifications__Smtp__From: ${SMTP_FROM:-dupli@localhost}
      Notifications__Office365__Credential: ${O365_CREDENTIAL:-ClientSecret}
      Notifications__Office365__TenantId: ${O365_TENANT_ID:-}
      Notifications__Office365__ClientId: ${O365_CLIENT_ID:-}
      Notifications__Office365__ClientSecret: ${O365_CLIENT_SECRET:-}
      Notifications__Office365__CertificatePath: ${O365_CERTIFICATE_PATH:-}
      Notifications__Office365__CertificatePassword: ${O365_CERTIFICATE_PASSWORD:-}
      Notifications__Office365__From: ${O365_FROM:-}
      Notifications__Office365__SaveToSentItems: ${O365_SAVE_TO_SENT_ITEMS:-false}
    volumes:
      # Keep the key ring OUT of the database volume and back it up separately:
      # without it the escrowed repository passwords cannot be decrypted.
      - dupli-keys:/var/lib/dupli/keys
      - dupli-tools:/var/lib/dupli/tools

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DUPLI_HOST: ${DUPLI_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports:
      - "8025:8025"

volumes:
  pgdata:
  dupli-keys:
  dupli-tools:
  caddy-data:
  caddy-config:
